<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="wiki-category" content="{カテゴリ名}">
<title>{カテゴリ名} - Personal Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Old+Mincho:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #d8d8ce; --paper2: #cbcbc0; --ink: #1d1d1a; --sub: #56564f;
  --spot: #22398b; --spot-soft: rgba(34,57,139,.30); --on-spot: #fff;
  --display: "Zen Antique", "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --text: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #15161b; --paper2: #1d1e26; --ink: #e7e4d8; --sub: #a9a79a; --spot: #93a8ff; --spot-soft: rgba(147,168,255,.28); --on-spot: #15161b; }
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.8;
  background-color: var(--paper);
  background-image: radial-gradient(color-mix(in srgb, var(--ink) 10%, transparent) .7px, transparent .9px);
  background-size: 4px 4px;
}
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--spot); outline-offset: 2px; }
.paper { max-width: 780px; margin: 0 auto; padding: 16px 18px 40px; }
.crumb { margin: 0 0 8px; font-size: 12px; }
.crumb a { color: var(--sub); text-decoration: none; }
.crumb a:hover { text-decoration: underline; }
.crumb .sep { margin: 0 .4em; color: var(--sub); }

/* ===== ヘッダー ===== */
.head { padding: 12px 14px 14px; text-align: center; border-top: 6px solid var(--ink); border-bottom: 2px solid var(--ink); background: var(--paper2); }
.head .kicker { margin: 0; font-family: var(--display); font-size: 12px; letter-spacing: .5em; color: var(--spot); }
.head h1 { margin: 4px 0 0; font-family: var(--display); font-weight: 400; line-height: 1.2; font-size: clamp(28px, 7vw, 48px); text-shadow: 3px 3px 0 var(--spot-soft); }
.head .count { margin: 4px 0 0; font-size: 13px; letter-spacing: .3em; color: var(--sub); }

/* ===== 目次 ===== */
.toc { margin: 20px 0; padding: 12px 16px; border: 1px solid var(--sub); background: var(--paper2); }
.toc-title { margin: 0 0 6px; font-family: var(--display); font-size: 14px; letter-spacing: .2em; color: var(--spot); }
.toc ol { margin: 0; padding-left: 1.6em; }
.toc li { margin-bottom: 2px; font-size: 14px; }
.toc a { text-decoration: none; color: var(--ink); }
.toc a:hover { text-decoration: underline; text-decoration-color: var(--spot); }

/* ===== エントリ ===== */
.entries { margin-top: 24px; }
.entry { padding: 18px 0; border-bottom: 1px dotted var(--sub); }
.entry:first-child { padding-top: 0; }
.entry-head { margin: 0 0 2px; font-family: var(--display); font-weight: 400; font-size: clamp(20px, 5vw, 28px); line-height: 1.3; text-shadow: 1.5px 1.5px 0 var(--spot-soft); }
.entry-date { margin: 0 0 8px; font-size: 12px; color: var(--sub); }
.entry-body { font-size: 14.5px; line-height: 1.85; text-align: justify; }
.entry-body p { margin: 0 0 8px; }
.entry-body p:last-child { margin-bottom: 0; }
.entry-body strong { font-weight: 900; }
.entry-body em { font-style: normal; border-bottom: 1px solid var(--spot); }
.entry-body code { font-family: "SF Mono", "Consolas", "Liberation Mono", "Menlo", monospace; font-size: 13px; padding: 1px 5px; background: var(--spot-soft); border-radius: 3px; }
.entry-body pre { margin: 8px 0; padding: 12px 14px; background: var(--paper2); border: 1px solid var(--sub); border-radius: 4px; overflow-x: auto; font-size: 13px; line-height: 1.6; }
.entry-body pre code { padding: 0; background: none; border-radius: 0; }
.entry-body ul, .entry-body ol { margin: 6px 0; padding-left: 1.4em; }
.entry-body li { margin-bottom: 4px; }
.entry-body h4 { margin: 12px 0 4px; font-family: var(--display); font-weight: 400; font-size: 16px; }

/* ===== 図解 ===== */
.entry-figure { margin: 12px 0; text-align: center; overflow-x: auto; }
.entry-figure svg { max-width: 100%; height: auto; }
.entry-table { width: 100%; margin: 10px 0; border-collapse: collapse; font-size: 14px; }
.entry-table th { padding: 6px 10px; background: var(--ink); color: var(--paper); font-family: var(--display); font-weight: 400; letter-spacing: .1em; text-align: left; }
.entry-table td { padding: 6px 10px; border-bottom: 1px dotted var(--sub); }
.entry-table tr:last-child td { border-bottom: none; }

/* ===== フッター ===== */
.foot { margin-top: 24px; padding-top: 10px; border-top: 6px solid var(--ink); text-align: center; font-size: 12px; color: var(--sub); }

@media (max-width: 600px) {
  .paper { padding: 12px 12px 32px; }
  .entry-body { text-align: left; }
}
</style>
</head>
<body>
<div class="paper">
  <p class="crumb"><a href="../../index.html">life 入口</a><span class="sep">/</span><a href="../index.html">Wiki</a></p>

  <header class="head">
    <p class="kicker">PERSONAL WIKI</p>
    <h1>{カテゴリ名}</h1>
    <p class="count">{件数}件のエントリ</p>
  </header>

  <!-- 目次: エントリが3件以上のとき表示する。2件以下なら <nav class="toc"> ごと省く -->
  <nav class="toc">
    <p class="toc-title">目次</p>
    <ol>
      <li><a href="#entry-id">{見出し}</a></li>
    </ol>
  </nav>

  <div class="entries">
    <!-- エントリをアルファベット・あいうえお順に並べる -->
    <article class="entry" id="{entry-id}">
      <h2 class="entry-head">{見出し}</h2>
      <p class="entry-date">{YYYY年MM月DD日}</p>
      <div class="entry-body">
        <p>{解説文}</p>
      </div>
    </article>
  </div>

  <footer class="foot">Personal Wiki は学んだことを蓄積する個人用百科事典です。</footer>
</div>
</body>
</html>
