<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="review-date" content="{YYYY-MM-DD}">
<meta name="review-range" content="{M月D日〜M月D日}">
<title>{YYYY年M月D日}の振り返り - Weekly Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Old+Mincho:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #d8d8ce; --paper2: #cbcbc0; --ink: #1d1d1a; --sub: #56564f;
  --spot: #22398b; --spot-soft: rgba(34,57,139,.30);
  --display: "Zen Antique", "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --text: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #15161b; --paper2: #1d1e26; --ink: #e7e4d8; --sub: #a9a79a; --spot: #93a8ff; --spot-soft: rgba(147,168,255,.28); }
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.8;
  background-color: var(--paper);
  background-image: radial-gradient(color-mix(in srgb, var(--ink) 10%, transparent) .7px, transparent .9px);
  background-size: 4px 4px;
}
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--spot); outline-offset: 2px; }
.paper { max-width: 720px; margin: 0 auto; padding: 16px 18px 40px; }
.crumb { margin: 0 0 8px; font-size: 12px; }
.crumb a { color: var(--sub); text-decoration: none; }
.crumb a:hover { text-decoration: underline; }
.crumb .sep { margin: 0 .4em; color: var(--sub); }
.head { padding: 12px 14px 14px; text-align: center; border-top: 6px solid var(--ink); border-bottom: 2px solid var(--ink); background: var(--paper2); }
.head .kicker { margin: 0; font-family: var(--display); font-size: 12px; letter-spacing: .5em; color: var(--spot); }
.head h1 { margin: 4px 0 0; font-family: var(--display); font-weight: 400; line-height: 1.25; font-size: clamp(26px, 6vw, 40px); text-shadow: 3px 3px 0 var(--spot-soft); }
.head .range { margin: 4px 0 0; font-size: 13px; letter-spacing: .2em; color: var(--sub); }
.prev { margin: 20px 0 0; padding: 10px 14px; border: 1px dashed var(--sub); background: var(--paper2); font-size: 14px; }
.prev p { margin: 0 0 4px; font-family: var(--display); color: var(--spot); letter-spacing: .1em; }
.prev ul { margin: 0; padding-left: 1.3em; }
.q { margin: 22px 0 0; }
.q h2 { margin: 0 0 6px; padding: 3px 12px; background: var(--ink); color: var(--paper); font-family: var(--display); font-weight: 400; font-size: 17px; letter-spacing: .08em; }
.q ul, .q ol { margin: 0; padding-left: 1.4em; }
.q li { margin-bottom: 4px; }
.q .none { margin: 0; color: var(--sub); }
.q.next h2 { background: var(--spot); color: var(--paper); }
.note { margin: 24px 0 0; padding: 12px 14px; border-left: 4px solid var(--spot); background: var(--spot-soft); font-size: 14px; }
.note p { margin: 0; }
.note .label { margin-bottom: 4px; font-family: var(--display); letter-spacing: .1em; }
.foot { margin-top: 28px; padding-top: 10px; border-top: 6px solid var(--ink); text-align: center; font-size: 12px; color: var(--sub); }
@media (max-width: 600px) { .paper { padding: 12px 12px 32px; } }
</style>
</head>
<body>
<div class="paper">
  <p class="crumb"><a href="../../index.html">life 入口</a><span class="sep">/</span><a href="../index.html">Weekly Review</a></p>

  <header class="head">
    <p class="kicker">WEEKLY REVIEW</p>
    <h1>{YYYY年M月D日}の振り返り</h1>
    <p class="range">{M月D日〜M月D日}</p>
  </header>

  <!-- 前回の「来週やりたいこと」。前回がなければ <section class="prev"> ごと省く -->
  <section class="prev">
    <p>先週の「来週やりたいこと」</p>
    <ul>
      <li>{前回の項目}</li>
    </ul>
  </section>

  <section class="q">
    <h2>① 今週やったこと</h2>
    <ul>
      <li>{回答}</li>
    </ul>
  </section>

  <section class="q">
    <h2>② うまくいったこと・楽しかったこと</h2>
    <ul>
      <li>{回答}</li>
    </ul>
  </section>

  <section class="q">
    <h2>③ うまくいかなかったこと・モヤっとしたこと</h2>
    <ul>
      <li>{回答}</li>
    </ul>
  </section>

  <section class="q">
    <h2>④ 学んだこと・気づき</h2>
    <ul>
      <li>{回答}</li>
    </ul>
  </section>

  <!-- 答えがない質問は、<ul> の代わりに <p class="none">なし</p> にする -->
  <section class="q next">
    <h2>⑤ 来週やりたいこと</h2>
    <ol id="next">
      <li>{回答}</li>
    </ol>
  </section>

  <section class="note">
    <p class="label">ひとこと</p>
    <p>{2〜3文}</p>
  </section>

  <footer class="foot">Weekly Review は毎週土曜の振り返りを残す記録です。</footer>
</div>
</body>
</html>
